name: family
description: "Family organiser for iPhone, iPad and Android."
publish_to: 'none'

# versionCode comes from the build number. It must rise strictly; CI will derive
# it from the run number (architecture doc §18) instead of hand edits.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  domain:
    path: ../../packages/domain
  family_crypto:
    path: ../../packages/crypto
  family_data:
    path: ../../packages/data
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.6.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  # Same constraint as packages/domain; the workspace resolves one version.
  timezone: ^0.9.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^18.0.1
  crypto: ^3.0.7
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  image_picker: ^1.2.3
  image: ^4.10.1
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  battery_plus: ^7.1.1
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
