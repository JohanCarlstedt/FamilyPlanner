name: family_data
description: Local store, sync and repositories for the family app (architecture doc §4, §7).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  cbor: ^6.5.1
  domain:
    path: ../domain
  drift: ^2.35.0
  family_crypto:
    path: ../crypto
  flutter:
    sdk: flutter
  http: ^1.6.0
  sqlite3: ^3.6.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  # ExternalLibrary, to load the Rust core built for the host in tests.
  flutter_rust_bridge: 2.13.0
  flutter_test:
    sdk: flutter
