[package]
name = "family_crypto"
version = "0.1.0"
edition = "2024"
publish = false
description = "Envelope encryption for the family app (docs/family-app-crypto-design.md)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Pinned exactly: the generated Dart and Rust glue must come from the same version.
flutter_rust_bridge = "=2.13.0"
chacha20poly1305 = "0.11"
ciborium = "0.2.2"
getrandom = "0.4"
hkdf = "0.13"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
