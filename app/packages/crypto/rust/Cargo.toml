[package]
name = "family_crypto"
version = "0.1.0"
edition = "2024"
publish = false
description = "Envelope encryption for the family app (docs/family-app-crypto-design.md)."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Pinned exactly: the generated Dart and Rust glue must come from the same version.
flutter_rust_bridge = "=2.13.0"
chacha20poly1305 = "0.11"
ciborium = "0.2.2"
ed25519-dalek = "3"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
# HPKE (RFC 9180) for sealing group keys to devices. Only the suite in crypto
# doc §3.1 is used: DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, ChaCha20-Poly1305.
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
openmls = "0.9.0"
openmls_rust_crypto = "0.6.0"
openmls_basic_credential = "0.6.0"
openmls_memory_storage = "0.6.0"
openmls_traits = "0.6.0"
bip39 = { version = "2", default-features = false, features = ["std"] }
argon2 = "0.5"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Debug app builds run the crypto optimised all the same: unoptimised,
# rebuilding the keyring at start took about nine seconds on a simulator.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
