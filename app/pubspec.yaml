name: family_workspace
description: Melos monorepo for the family app (architecture doc §4 "Project layout").
publish_to: none

environment:
  sdk: ^3.13.0

# Packages are added here as they're built: ui_kit is still a .gitkeep
# placeholder.
workspace:
  - packages/domain
  - packages/crypto
  - packages/data
  - apps/family

dev_dependencies:
  melos: ^8.8.0

hooks:
  user_defines:
    sqlite3:
      # SQLite3 Multiple Ciphers: the local store is encrypted at rest
      # (architecture doc §4). Defaults to ChaCha20-Poly1305.
      source: sqlite3mc

melos:
  scripts:
    analyze:
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
      description: Static analysis in every package.
    test:domain:
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        scope: domain
      description: The golden suite. Pure Dart, runs in seconds.
    test:app:
      exec:
        command: flutter test
        concurrency: 1
      packageFilters:
        scope: family
      description: Widget tests for the Flutter app.
    run:dev:
      exec:
        command: flutter run --flavor dev
        concurrency: 1
      packageFilters:
        scope: family
      description: Run the dev flavour on the connected device or emulator.
